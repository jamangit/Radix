services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wordmeter
      POSTGRES_PASSWORD: wordmeter
      POSTGRES_DB: wordmeter
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordmeter"]
      interval: 5s
      retries: 5

volumes:
  db-data: